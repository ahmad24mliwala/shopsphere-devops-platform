name: ShopSphere CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build, Start and Test Microservices
    runs-on: ubuntu-latest

    env:
      DB_NAME: shopsphere_ci
      DB_USER: shopsphere_ci
      DB_PASSWORD: ci_test_password_only

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Security Scanner
        run: python -m pip install -r requirements-security.txt

      - name: Audit Python Dependencies
        run: |
          for file in services/*/requirements.txt; do
            echo "Auditing $file"
            pip-audit -r "$file"
          done

      - name: Build and Start Application
        run: docker compose up --build -d

      - name: Scan User Service Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: shopsphere-devops-platform-user-service:latest
          version: v0.76.2
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan Product Service Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: shopsphere-devops-platform-product-service:latest
          version: v0.76.2
          skip-setup-trivy: true
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan Order Service Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: shopsphere-devops-platform-order-service:latest
          version: v0.76.2
          skip-setup-trivy: true
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan Payment Service Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: shopsphere-devops-platform-payment-service:latest
          version: v0.76.2
          skip-setup-trivy: true
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate CycloneDX SBOMs
        run: |
          mkdir -p sbom

          trivy image --format cyclonedx \
            --output sbom/user-service.cdx.json \
            shopsphere-devops-platform-user-service:latest

          trivy image --format cyclonedx \
            --output sbom/product-service.cdx.json \
            shopsphere-devops-platform-product-service:latest

          trivy image --format cyclonedx \
            --output sbom/order-service.cdx.json \
            shopsphere-devops-platform-order-service:latest

          trivy image --format cyclonedx \
            --output sbom/payment-service.cdx.json \
            shopsphere-devops-platform-payment-service:latest

      - name: Upload SBOM Reports
        uses: actions/upload-artifact@v7
        with:
          name: shopsphere-cyclonedx-sboms
          path: sbom/
          if-no-files-found: error
          retention-days: 30

      - name: Wait for Microservices
        run: |
          for port in 8001 8002 8003 8004; do
            echo "Waiting for service on port $port"

            for attempt in $(seq 1 30); do
              if curl --silent --fail \
                http://127.0.0.1:$port/health; then
                echo ""
                break
              fi

              if [ "$attempt" -eq 30 ]; then
                echo "Service on port $port did not become healthy"
                docker compose ps
                docker compose logs
                exit 1
              fi

              sleep 5
            done
          done

      - name: Run Automated Tests
        run: pytest -v

      - name: Show Logs on Failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=100

      - name: Stop Application
        if: always()
        run: docker compose down
