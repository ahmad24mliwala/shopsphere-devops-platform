global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "user-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["user-service:8000"]

  - job_name: "product-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["product-service:8000"]

  - job_name: "order-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["order-service:8000"]

  - job_name: "payment-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["payment-service:8000"]

  - job_name: "kubernetes-apiserver"
    scrape_interval: 30s
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["172.31.38.252:6443"]
    bearer_token_file: /etc/prometheus/k3s/token
    tls_config:
      ca_file: /etc/prometheus/k3s/server-ca.crt

  - job_name: "kube-state-metrics"
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets: ["172.18.0.1:18080"]
