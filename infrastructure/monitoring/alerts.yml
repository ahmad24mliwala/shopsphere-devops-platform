groups:
  - name: shopsphere-alerts
    rules:
      - alert: ServiceDown
        expr: up{job=~"user-service|product-service|order-service|payment-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ShopSphere service is down"
          description: "{{ $labels.job }} has been unavailable for more than 1 minute."

      - alert: HighErrorRate
        expr: |
          (
            sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum by (service) (rate(http_requests_total[5m])), 0.001)
          ) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "{{ $labels.service }} has an HTTP 5xx error rate above 5%."

      - alert: HighAPILatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, service) (
              rate(http_request_duration_seconds_bucket[5m])
            )
          ) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High API response latency"
          description: "{{ $labels.service }} p95 latency exceeds 1 second."
