services:
  db:
    image: postgres:16-alpine
    container_name: shopsphere-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 384m

  user-service:
    build: ./services/user-service
    container_name: shopsphere-user
    ports:
      - "127.0.0.1:8001:8000"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy

  product-service:
    build: ./services/product-service
    container_name: shopsphere-product
    ports:
      - "127.0.0.1:8002:8000"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy

  order-service:
    build: ./services/order-service
    container_name: shopsphere-order
    ports:
      - "127.0.0.1:8003:8000"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy

  payment-service:
    build: ./services/payment-service
    container_name: shopsphere-payment
    ports:
      - "127.0.0.1:8004:8000"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
